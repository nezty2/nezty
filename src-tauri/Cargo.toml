[package]
name = "nezty"
version = "0.6.0"
description = "nezty: eerlijke, omkeerbare game-tweaks voor Windows 10 en 11"
authors = ["Nezty"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "nezty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Zelftests (--selftest, --selftest-license enzovoort) zitten alleen in een build met deze feature:
#   npm run tauri build -- --features selftest
# Een gewone release (build.ps1, release.yml) bouwt zonder.
[features]
selftest = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
minisign-verify = "0.3"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
png = "0.18"
base64 = "0.22"
ed25519-dalek = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
regex = "1"
sysinfo = "0.39"
winreg = "0.56"
wmi = "0.18"
nvml-wrapper = "0.13"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_System_Threading",
  "Win32_System_Power",
  "Win32_System_LibraryLoader",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_NetworkManagement_WiFi",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_UI_Accessibility",
  "Win32_UI_Input",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_System_IO",
  "Win32_UI_Input_XboxController",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_System_Registry",
  "Win32_System_Shutdown",
  "Win32_System_Com",
  "Win32_System_Diagnostics_Etw",
  "Win32_System_Time",
  "Wdk_Graphics_Direct3D",
] }

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
